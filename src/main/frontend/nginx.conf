# Nginx Configuration for Frontend Service
# Purpose: Serve static files and reverse proxy API requests to backend

server {
    # Listen on port 80 (HTTP)
    listen 80;

    # Accept requests for any hostname
    server_name _;

    # Root location: Serve static files
    location / {
        # Base directory for static files
        root /usr/share/nginx/html;

        # Default file to serve
        index index.html;

        # Try to serve requested file, fallback to index.html (for SPA)
        try_files $uri $uri/ /index.html;
    }

    # API proxy location: Forward all /api/* requests to backend service
    location /api/ {
        # Backend service DNS name (Kubernetes internal DNS)
        # Format: service-name.namespace.svc.cluster.local:port
        proxy_pass http://backend-service.backend-ns.svc.cluster.local:8080;

        # Preserve original Host header
        proxy_set_header Host $host;

        # Pass client's real IP address to backend
        proxy_set_header X-Real-IP $remote_addr;

        # Pass proxy chain information
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Pass original protocol (http/https)
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
# Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
# ddl-auto options:
#   - update: Updates schema, preserves data (good for development)
#   - validate: Only validates schema (safe, read-only)
#   - none: Do nothing (production-ready)
#   - create-drop: Drops and recreates (DESTRUCTIVE - old setting)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Server Configuration
server.port=8080

# SQL Initialization
# Changed to 'never' to prevent running data.sql on every startup
# Only use 'always' for initial setup, then change to 'never'
spring.sql.init.mode=never
spring.sql.init.data-locations=classpath:data.sql
spring.jpa.defer-datasource-initialization=true

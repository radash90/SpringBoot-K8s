apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  namespace: backend-ns
spec:
  replicas: 2
  selector:
    matchLabels:
      app: springboot-app
  template:
    metadata:
      labels:
        app: springboot-app
    spec:
      containers:
        - name: springboot
          image: radash90/springboot-app:2.1
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            # Environment variables from Secret
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                configMapKeyRef:
                  # name of the secret from where we get the key
                  name: backend-config
                  key: SPRING_DATASOURCE_URL
            # Environment variables from Secret
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  # name of the secret from where we get the key
                  name: backend-secret
                  key: SPRING_DATASOURCE_USERNAME
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: SPRING_DATASOURCE_PASSWORD
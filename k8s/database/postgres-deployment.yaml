apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-deployment
  namespace: database-ns
spec:
  replicas: 2
  selector:
    matchLabels:
      app: postgres-db
  template:
    metadata:
      labels:
        app: postgres-db
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        ports:
        - containerPort: 5432
        volumeMounts:
          - mountPath: /var/lib/postgresql/data
            name: database-volume
        env:
          # Environment variables from Secret
          - name: POSTGRES_DB
            valueFrom:
              secretKeyRef:
                # name of the secret from where we get the key
                name: postgres-secret
                key: POSTGRES_DB
          # Environment variables from Secret
          - name: POSTGRES_USER
            valueFrom:
              secretKeyRef:
                # name of the secret from where we get the key
                name: postgres-secret
                key: POSTGRES_USER
          - name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: postgres-secret
                key: POSTGRES_PASSWORD
      volumes:
        - name: database-volume
          persistentVolumeClaim:
            claimName: postgres-claim
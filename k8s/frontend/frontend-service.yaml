apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: frontend-ns
  labels:
    app: frontend-app
    tier: web
spec:
  # Service type: ClusterIP for internal access (exposed via Ingress)
  type: ClusterIP

  # Selector: Find pods to route traffic to
  selector:
    app: frontend-app            # Must match deployment pod labels

  # Port mapping
  ports:
  - name: http
    protocol: TCP
    port: 80                     # External port (what users connect to)
    targetPort: 80               # Container port (where Nginx listens)

  # Optional: Session affinity (sticky sessions)
  sessionAffinity: None